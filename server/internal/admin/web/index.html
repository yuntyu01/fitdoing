<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>핏두잉 관리자</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main>
  <h1>핏두잉 관리자</h1>
  <form id="login" hidden>
    <!-- 브라우저 비밀번호 관리자가 저장·자동 입력하도록 사용자명 칸을 둔다 -->
    <input type="text" name="username" value="admin" autocomplete="username" hidden readonly>
    <label for="password">관리자 비밀번호</label>
    <div class="row">
      <input id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" required>
      <button type="submit">로그인</button>
    </div>
    <p class="note">한 번 로그인하면 이 브라우저에서 30일 동안 유지돼요.</p>
  </form>
  <p id="status" role="status"></p>
  <section id="panel" hidden>
    <p class="note" id="models"></p>
    <div class="table">
      <table>
        <thead><tr><th>사용자</th><th>로그인</th><th>가입</th><th>AI 모델</th><th>실제 사용</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <div class="row end">
      <button id="more" type="button" class="ghost">더 보기</button>
      <button id="logout" type="button" class="ghost">로그아웃</button>
    </div>
  </section>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
