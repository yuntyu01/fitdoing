<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>핏두잉 관리자</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main>
  <h1>핏두잉 관리자</h1>
  <form id="login">
    <label for="token">관리자 토큰 (ADMIN_TOKEN)</label>
    <div class="row">
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="토큰을 붙여 넣으세요">
      <button type="submit">불러오기</button>
    </div>
    <p class="note">토큰은 이 탭에만 기억해요. 탭을 닫으면 지워져요.</p>
  </form>
  <p id="status" role="status"></p>
  <section id="panel" hidden>
    <p class="note" id="models"></p>
    <div class="table">
      <table>
        <thead><tr><th>사용자</th><th>로그인</th><th>가입</th><th>AI 모델</th><th>실제 사용</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <div class="row end">
      <button id="more" type="button" class="ghost">더 보기</button>
      <button id="logout" type="button" class="ghost">토큰 지우기</button>
    </div>
  </section>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
