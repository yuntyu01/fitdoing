name: "CI: app"

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci-app.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      # 번들이 실제로 만들어지는지 (마이그레이션 .sql 인라인, 폰트 require 포함)
      - run: npx expo export --platform android --output-dir /tmp/export
