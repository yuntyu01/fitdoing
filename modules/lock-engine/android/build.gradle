plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lockengine'
version = '0.1.0'

android {
  namespace "expo.modules.lockengine"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  testOptions {
    unitTests.all { useJUnit() }
  }
}

dependencies {
  // 순수 로직(core.logic) JVM 단위 테스트. 실제 앱에서는 org.json 을 android.jar 가 제공한다.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
